<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVIE INFO LK - Discover Every Movie</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#06070d; color:white; font-family:'Inter', sans-serif; overflow-x:hidden; }
header { display:flex; justify-content:space-between; align-items:center; padding:20px 60px; border-bottom:1px solid #ffffff1a; backdrop-filter:blur(10px); }
.logo { font-family:'Orbitron'; font-size:28px; color:#7ef4ff; text-shadow:0 0 15px #8b5cf6; }
nav a { color:#aaa; margin:0 12px; text-decoration:none; }
nav a.active { color:white; border-bottom:2px solid #8b5cf6; }
.hero { min-height:90vh; display:flex; align-items:center; padding:0 60px; position:relative; background: linear-gradient(to right, #06070d 40%, transparent 80%), url('gojo.jpg'); background-size:cover; background-position:right center; }
.hero-content { max-width:600px; z-index:2; }
.hero h1 { font-family:'Orbitron'; font-size:56px; line-height:1.1; }
.hero h1 .c1 { color:#8cf8ff; text-shadow:0 0 20px #00f2ff; }
.hero h1 .c2 { color:#d68cff; text-shadow:0 0 20px #8b5cf6; }
.hero p { margin:20px 0; color:#b8c0d0; line-height:1.6; }
.btns { display:flex; gap:15px; margin:25px 0; }
.btn { padding:14px 28px; border-radius:12px; border:none; cursor:pointer; font-weight:600; }
.btn-p { background:linear-gradient(90deg,#6a5af9,#8b5cf6); color:white; box-shadow:0 0 20px #8b5cf6a0; }
.btn-s { background:transparent; border:1px solid #7ef4ff; color:white; }
.search-box { margin-top:20px; display:flex; align-items:center; background:#ffffff0d; border:1px solid #7ef4ff; border-radius:12px; padding:8px 15px; }
.search-box input { background:transparent; border:none; outline:none; color:white; width:100%; font-size:16px; }
.search-box button { background:#8b5cf6; border:none; padding:8px 18px; border-radius:8px; color:white; cursor:pointer; }
.footer { text-align:center; padding:25px; border-top:1px solid #8b5cf622; background:#0a0a14; font-family:'Orbitron'; letter-spacing:1px; }
.footer span { color:#d68cff; text-shadow:0 0 15px #8b5cf6; animation:glow 2s infinite alternate; }
@keyframes glow { from { text-shadow:0 0 10px #8b5cf6; } to { text-shadow:0 0 25px #d68cff; } }
.tags { margin-top:15px; display:flex; gap:10px; }
.tag { border:1px solid #8b5cf6; padding:5px 12px; border-radius:20px; font-size:13px; color:#aaa; }
</style>
</head>
<body>

<header>
<div class="logo">MOVIE INFO LK ⊙</div>
<nav>
<a class="active" href="#">Home</a>
<a href="#">Movies</a>
<a href="#">Series</a>
<a href="#">Trending</a>
<a href="#">Genres</a>
</nav>
<div>Sign In</div>
</header>

<section class="hero">
<div class="hero-content">
<h1><span class="c1">DISCOVER EVERY MOVIE</span><br><span class="c2">DETAILS</span></h1>
<p>Get ratings, cast, trailers, release dates & more — all in one place. Stream smarter with real-time info trusted by fans.</p>
<div class="btns">
<button class="btn btn-p">▶ Explore Movies</button>
<button class="btn btn-s">↗ Trending Now</button>
</div>
<div class="search-box">
<input type="text" id="search" placeholder="Search for movies, series, actors...">
<button onclick="searchMovie()">Search</button>
</div>
<div class="tags">
<div class="tag">🎬 10K+ Movies</div>
<div class="tag">⚡ Live Updates</div>
<div class="tag">🎥 HD Trailers</div>
</div>
</div>
</section>

<div class="footer">Made by <span>Sanuka</span> 💜</div>

<script>
// Simple search
function searchMovie(){
 let q = document.getElementById('search').value;
 alert('Searching for: ' + q + ' - movies.json eken load wenawa!');
}
</script>
</body>
  </html>
